name: TaskConnect CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Server checks
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Initialize Prisma Schema & SQLite DB
        working-directory: ./server
        run: |
          npx prisma db push
          node prisma/seed.js

      - name: Run Backend Integration & Security Tests
        working-directory: ./server
        run: npm test

      # Client checks
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend Production Artifacts
        working-directory: ./client
        run: npm run build
